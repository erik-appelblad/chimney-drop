<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050a16" />
  <title>Sleigh Bells</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071122'/%3E%3Cpath d='M41 10a23 23 0 1 0 12 36A19 19 0 0 1 41 10Z' fill='%23ffd37d'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="/assets/index-DjXjwob7.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-arO5KDzD.css">
</head>
<body data-mode="boot">
  <canvas id="game" aria-label="Sleigh Bells game"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <div id="hud" class="hud" aria-live="polite">
    <section class="panel hud-card">
      <div class="hud-head">
        <div class="hud-title">
          <span class="eyebrow">Level <b id="levelNum">1</b> · <span id="levelName">First Snow</span></span>
          <div class="score"><span id="score">0</span><span class="score-target">/ <span id="target">500</span></span></div>
        </div>
        <div class="mult" id="mult">×1</div>
      </div>
      <div class="bar"><i id="scoreBar"></i></div>
      <div class="hud-foot">
        <div class="sack">
          <span class="eyebrow">Sack</span>
          <div id="pips" class="pips"></div>
        </div>
        <div class="hits"><span class="eyebrow">Hits</span><b id="hits">0</b></div>
      </div>
    </section>
  </div>

  <div id="topbar">
    <button id="muteBtn" class="icon-btn" aria-label="Toggle sound" title="Sound (M)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="wave" d="M16 8.5c1.3 1 1.3 6 0 7M18.5 6c2.6 2.4 2.6 9.6 0 12"/></svg>
    </button>
    <button id="restartBtn" class="icon-btn" aria-label="Restart level" title="Restart level (R)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button id="menuBtn" class="icon-btn" aria-label="Pause menu" title="Pause (Esc)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M5 5h5v14H5zM14 5h5v14h-5z"/></svg>
    </button>
  </div>

  <div id="toast" role="status"></div>
  <div id="popups" aria-hidden="true"></div>
  <div id="aimPrompt" aria-hidden="true"><b>DROP</b><span>now</span></div>
  <div id="hint">Mouse to steer · Click or Space to drop · W/S altitude · R restart</div>

  <div id="touch" aria-hidden="true">
    <div id="stick"><div id="stickKnob"></div><span>STEER</span></div>
    <button id="dropBtn">DROP</button>
  </div>

  <div id="screen" class="screen">
    <div id="screenCard" class="card"></div>
  </div>

  <div id="boot">
    <div class="boot-moon">☾</div>
    <div>Lighting the lanterns…</div>
  </div>

</body>
</html>
